[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "echo-voice-service"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.135.1", "starlette==0.52.1", "uvicorn==0.41.0", "pydantic==2.12.5",
  "numpy==2.2.6", "soundfile==0.13.1", "psutil==7.2.2",
  "huggingface-hub==0.36.2", "PyYAML==6.0.3", "pywebrtc-audio==0.2.0",
]

[project.optional-dependencies]
speech = [
  "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "silero-vad==6.2.0", "onnxruntime==1.24.3",
  "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pyannote.audio==3.4.0", "torch==2.8.0", "torchaudio==2.8.0",
  "transformers==4.57.6", "imageio-ffmpeg==0.6.0", "setuptools==80.10.2",
]

[dependency-groups]
test = ["pytest==9.0.2", "httpx==0.28.1", "pytest-asyncio==1.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["echo_service"]

[tool.hatch.build.targets.wheel.force-include]
"models.json" = "echo_service/models.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "../tmp/service-pytest-cache"
asyncio_mode = "auto"
